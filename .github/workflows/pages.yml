# Publishes pages/ to GitHub Pages. Without this the learning guide is
# unreadable in practice: GitHub serves pages/index.html as *source*, so the
# README link to it lands a reader on raw HTML. The pages are dependency-free
# static files, so there is no build step — the directory is the artifact.
#
# One-time repo setup: Settings → Pages → Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Upload pages/ as the site root, so the published URL is
      # <org>.github.io/retention-bench/ rather than /retention-bench/pages/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@v4
