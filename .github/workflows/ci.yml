name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Non-editable install on purpose: this is the packaging shape a real
      # user gets from `pip install retention-bench` / a wheel, and it is
      # exactly what an editable install (`pip install -e .`) papers over by
      # leaking the repo root onto sys.path. RB-11 (2026-07-07 v0.1 review,
      # finding 4): `scorer` used to be shipped-but-unpackaged, so this step
      # is the regression guard against that class of bug recurring.
      - name: Install (non-editable)
        run: pip install .

      # `.[dev]` rather than bare pytest: the notes-SUT tests and the
      # fake-OpenAI shim need PyYAML, which is only an accident of the
      # transitive dep tree (via huggingface-hub) unless declared.
      - name: Install test dependencies
        run: pip install ".[dev]"

      # `pip install .` above already pulled `cl-benchmark` (it's a hard
      # dependency), but as a *wheel*, and cl-benchmark's packaging ships only
      # .py files — the templates/, variants/, and schedules/ data its tasks
      # load via `Path(__file__).parent` are silently dropped, so every
      # task-constructing test fails ("Unknown variant ..."). Reinstalling the
      # same pin *editable* keeps the full source tree on disk. This is an
      # upstream packaging gap (no package-data config in their pyproject);
      # until it's fixed there, editable is the only install shape that works.
      # MUST be the last pip step: any later `pip install` that re-resolves
      # the pyproject pin clobbers the editable back to a data-less wheel.
      # Keep the SHA in lockstep with the pin in pyproject.toml.
      - name: Reinstall cl-benchmark editable (its wheel drops package data)
        run: pip install -e "git+https://github.com/pgasawa/continual-learning-bench.git@9cc63c0f429048b843e8d43ac4f2b0ea4df13724#egg=cl-benchmark"

      # torch is deliberately absent, so the constructive-SUT tests skip;
      # docker-gated tests skip likewise. Everything else runs for real —
      # cl-benchmark is installed (hard dep), so the
      # `importorskip("src.interface")` guards do NOT fire here.
      # Before pytest: a stale generated file is a one-line failure, and saying so
      # plainly beats surfacing it as one dot among ~270. tests/test_doc_claims.py
      # asserts the same thing, so this is a nicer error, not the only guard.
      - name: Check generated decision renderings are current
        run: python tools/decisions.py check

      - name: Run test suite
        run: pytest
