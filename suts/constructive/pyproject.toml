[project]
name = "retention-bench-sut-constructive"
version = "0.1.0"
description = "Constructive (train-and-grow) reference SUT for retention-bench. Integration example for weights-mutating, capacity-growing models — not a quality baseline."
requires-python = ">=3.10"
dependencies = [
  # CPU-only torch. Pinned major; the CPU wheel is selected via the
  # PyTorch CPU index at install time:
  #   pip install --index-url https://download.pytorch.org/whl/cpu torch
  "torch>=2.1,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["constructive*"]
