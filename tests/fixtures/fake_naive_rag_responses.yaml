# Canned responses for the naive-rag fake-openai integration test.
# Sequence-keyed: the Nth call to client.chat.completions.create() returns
# responses[N]. two_chapter.yaml drives:
#   READ ch1   → no LLM call (only embedding calls)
#   READ ch2   → no LLM call (only embedding calls)
#   QUIZ ceiling → call 0  (SUT process #1; retrieves chunks from index)
#   RESET (no call; SUT killed/respawned)
#   QUIZ retention k=1 → call 1  (SUT process #2; index survives RESET)
#
# Token counts are distinct primes so the aggregate (sum of both) is
# unambiguously the sum and not either one alone.
responses:
  # QUIZ ceiling: SUT process #1, retrieves from in-memory+disk index.
  # Both answers present because fake embedder returns deterministic vectors
  # that surface relevant chunks.
  - text: |
      <ANSWER id="q1">Mira Vexin</ANSWER>
      <ANSWER id="q2">Halton Reeve</ANSWER>
    input_tokens: 157
    output_tokens: 23

  # QUIZ retention k=1: SUT process #2 (post-RESET), reads index from disk.
  # Same answers prove index survived RESET; different token counts make
  # aggregation unambiguous.
  - text: |
      <ANSWER id="q1">Mira Vexin</ANSWER>
      <ANSWER id="q2">Halton Reeve</ANSWER>
    input_tokens: 163
    output_tokens: 29
