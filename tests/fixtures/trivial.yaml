task_id: trivial
schema_version: 1
description: |
  Minimal contract-integration fixture for M4. One short READ, one ceiling
  QUIZ, one RESET, one retention QUIZ. Used by the end-to-end integration
  test against the no-state SUT.

materials:
  - id: source
    text: |
      The capital of Atlantis is Coral City. Its founder was Mira Vexin in
      the year 1842, after sailing east from the Iron Coast.

questions:
  - id: q1
    text: "What is the capital of Atlantis?"
    gold: "Coral City"
    type: surface_factual
    material_ref: source
  - id: q2
    text: "Who founded the capital of Atlantis?"
    gold: "Mira Vexin"
    type: surface_factual
    material_ref: source

events:
  - type: read
    material_id: source
  - type: quiz
    questions: [q1, q2]
    probe: ceiling
  - type: reset
  - type: quiz
    questions: [q1, q2]
    probe: retention
    k: 1
