# Canned responses for the fake-anthropic integration test. Sequence-keyed:
# the Nth call to client.messages.create() returns responses[N].
#
# trivial.yaml drives two QUIZ events split by one RESET, so the no-state SUT
# makes exactly two messages.create() calls — one per SUT subprocess. Distinct
# token counts let us verify the harness aggregates both correctly across the
# RESET boundary (regression for the M7 dropped-resource-fields bug).
responses:
  # QUIZ #1 (ceiling probe): SUT process #1, has just READ the material.
  - text: |
      <ANSWER id="q1">Coral City</ANSWER>
      <ANSWER id="q2">Mira Vexin</ANSWER>
    input_tokens: 142
    output_tokens: 23

  # QUIZ #2 (retention probe, k=1): SUT process #2, after RESET. No-state has
  # no memory, so realistic answers are Unknown. Different token counts so the
  # aggregate (172 in / 39 out) is unambiguously the sum of both, not either
  # one alone or some default.
  - text: |
      <ANSWER id="q1">Unknown</ANSWER>
      <ANSWER id="q2">Unknown</ANSWER>
    input_tokens: 30
    output_tokens: 16
