# Canned responses for the notes-llm fake-anthropic integration test.
# Sequence-keyed: the Nth call to client.messages.create() returns
# responses[N]. two_chapter.yaml drives:
#   READ ch1 → call 0  (notes file: empty → ch1 summary)
#   READ ch2 → call 1  (notes file: must include ch1 + ch2)
#   QUIZ ceiling → call 2  (SUT process #1)
#   RESET (no call; SUT killed/respawned)
#   QUIZ retention k=1 → call 3  (SUT process #2; notes loaded from DIR)
#
# Token counts are distinct primes so the aggregate (sum of all four) is
# unambiguously the sum and not any subset.
responses:
  # READ #1: first chapter, prior notes empty. Model writes ch1-only notes.
  - text: |
      <NOTES>
      - Capital of Atlantis: Coral City.
      - Founder: Mira Vexin, in 1842, after sailing east from the Iron Coast.
      </NOTES>
    input_tokens: 101
    output_tokens: 41

  # READ #2: second chapter, prior notes contain ch1. Cumulative — model
  # MUST preserve ch1 facts, else q1 retention will be Unknown.
  - text: |
      <NOTES>
      Atlantis:
      - Capital: Coral City. Founder: Mira Vexin (1842, sailed from Iron Coast).
      - Second city: Pearl Harbor. Founder: Halton Reeve (1851, cartographer
        from Coral City).
      - Verdant Beacon lighthouse in Pearl Harbor, completed 1860.
      </NOTES>
    input_tokens: 211
    output_tokens: 79

  # QUIZ ceiling: SUT process #1, reads notes.md, answers both questions.
  - text: |
      <ANSWER id="q1">Mira Vexin</ANSWER>
      <ANSWER id="q2">Halton Reeve</ANSWER>
    input_tokens: 131
    output_tokens: 23

  # QUIZ retention k=1: SUT process #2 (post-RESET), reads notes.md from
  # disk, answers from notes. Same answers prove notes survived RESET and
  # the second subprocess actually ran (counter advances to 4).
  - text: |
      <ANSWER id="q1">Mira Vexin</ANSWER>
      <ANSWER id="q2">Halton Reeve</ANSWER>
    input_tokens: 137
    output_tokens: 29
