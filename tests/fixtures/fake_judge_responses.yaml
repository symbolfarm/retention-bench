# Canned judge responses for the fake-openai integration tests.
# Sequence-keyed: the Nth call to client.chat.completions.create() returns responses[N].
#
# This fixture is used by test_scorer_judge.py to test the LLM-judge scorer
# deterministically without live API calls.
#
# The smoke-test scenario (q3 flip):
#   q3 (entity_tracking): gold="the police", sut="Three police officers"
#   → judge correctly scores 1 (semantically equivalent)
#
# q1, q2, q4, q5 are surface_factual → exact-match, no judge call.
# q3 prior probe: entity_tracking → judge call #0
# q3 ceiling probe: entity_tracking → judge call #1
# q3 retention k=1 probe: entity_tracking → judge call #2
responses:
  # q3 prior probe: sut="Unknown" vs gold="the police" → 0
  - tool_use:
      name: judge_verdict
      input:
        rationale: >-
          The SUT answered 'Unknown', which provides no factual content.
          The gold answer is 'the police'. These are not semantically equivalent.
        score: 0
    input_tokens: 120
    output_tokens: 45

  # q3 ceiling probe: sut="Three police officers" vs gold="the police" → 1
  - tool_use:
      name: judge_verdict
      input:
        rationale: >-
          'Three police officers' refers to the same entity as 'the police' in context.
          The SUT answer conveys the same core factual content with minor elaboration.
        score: 1
    input_tokens: 130
    output_tokens: 50

  # q3 retention k=1 probe: sut="Three police officers" vs gold="the police" → 1
  - tool_use:
      name: judge_verdict
      input:
        rationale: >-
          'Three police officers' refers to the same entity as 'the police' in context.
          The SUT answer conveys the same core factual content with minor elaboration.
        score: 1
    input_tokens: 130
    output_tokens: 50
